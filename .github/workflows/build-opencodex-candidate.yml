name: Build OpenCodex Windows candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed commit in luvs01/opencodex
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: opencodex-windows-candidate
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'luvs01/opencodex-automation' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate immutable input
        shell: pwsh
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'An exact commit SHA is required' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: luvs01/opencodex
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
      - name: Check source and install dependencies
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:CANDIDATE_SHA) { throw 'Source mismatch' }
          bun scripts/release-version-sources.ts check 2.72.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun x tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build dashboard
        run: bun run build:gui
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Prepare compiled sidecar
        run: bun desktop/scripts/prepare-sidecar.ts --target x86_64-pc-windows-msvc
      - name: Build unsigned local MSI
        shell: pwsh
        working-directory: desktop
        run: |
          $config = @{bundle=@{createUpdaterArtifacts=$false;windows=@{wix=@{version='2.72.0'}}}} | ConvertTo-Json -Depth 6 -Compress
          $config | Set-Content -Encoding utf8 -LiteralPath "$env:RUNNER_TEMP/local-candidate.json"
          bunx tauri build --ci --target x86_64-pc-windows-msvc --bundles msi --config "$env:RUNNER_TEMP/local-candidate.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage candidate and provenance
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi)
          if ($msis.Count -ne 1) { throw 'Expected exactly one candidate MSI' }
          New-Item -ItemType Directory -Path candidate | Out-Null
          $target = 'candidate/OpenCodex-2.72.0-compat.6079.msi'
          Copy-Item -LiteralPath $msis[0].FullName -Destination $target
          $digest = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          "$digest  OpenCodex-2.72.0-compat.6079.msi" | Set-Content candidate/SHA256SUMS.txt
          @{sourceCommit=$env:CANDIDATE_SHA;releaseBase='5ab6d52b2a4da722d398e4ab50a6c621ac3ce087';version='2.72.0';customCompatibility=$true;officialRelease=$false;msiSha256=$digest;runId=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content candidate/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencodex-windows-candidate
          path: candidate/
          retention-days: 7
          if-no-files-found: error
